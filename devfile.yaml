schemaVersion: 2.1.0
metadata:
  name: gr2610 #keep it 14 characters or less for the devcontainer name
components:
  - name: bithub
    container:
      image: adrianstoica/it1901:latest
      memoryLimit: 3Gi
      endpoints:
        - exposure: public # needed for the devcontainer UI to be accessible from the browser via no VNC
          name: 01-desktop-ui
          protocol: https
          targetPort: 6080
          secure: true #required
          attributes:
            urlRewriteSupported: 'true' #required
        - exposure: public
          name: 5900-tcp
          protocol: http
          targetPort: 5900 #typical VNC port
        - exposure: public
          name: 5901-tcp
          protocol: http
          targetPort: 5901 #typical VNC port
        - exposure: public
          name: 8080-tcp
          protocol: http
          targetPort: 8080 #REST-serveren (Spring Boot)
commands:
  - id: bygg-og-test
    exec:
      label: "1. Bygg og test (mvn clean verify)"
      component: bithub
      workingDir: ${PROJECT_SOURCE}/bithub
      commandLine: mvn clean verify
      group:
        kind: build
        isDefault: true
  - id: start-server
    exec:
      label: "2. Start REST-serveren"
      component: bithub
      workingDir: ${PROJECT_SOURCE}/bithub
      commandLine: mvn install -DskipTests && mvn -pl springboot/restserver spring-boot:run
      group:
        kind: run
        isDefault: true
  - id: start-app
    exec:
      label: "3. Start JavaFX-appen"
      component: bithub
      workingDir: ${PROJECT_SOURCE}/bithub
      commandLine: mvn install -DskipTests && mvn -pl ui javafx:run
      group:
        kind: run
